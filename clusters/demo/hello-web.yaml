apiVersion: v1
kind: Namespace
metadata:
  name: hello
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-web
  namespace: hello
spec:
  replicas: 3
  selector:
    matchLabels: { app: hello-web }
  template:
    metadata:
      labels: { app: hello-web }
    spec:
      containers:
      - name: hello-web
        image: us-west2-docker.pkg.dev/totemic-audio-512904-f8/quickstart-docker-repo/hello-web:d5fe664
        ports:
        - containerPort: 8080
        resources:
          requests: { cpu: 250m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: hello-web
  namespace: hello
spec:
  type: LoadBalancer
  selector: { app: hello-web }
  ports:
  - port: 80
    targetPort: 8080
